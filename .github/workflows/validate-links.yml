name: Validate profile links

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-mail
            --exclude-loopback
            README.md
            README.pt-BR.md
            PORTFOLIO_ARCHITECTURE.md
            PORTFOLIO_ARCHITECTURE.pt-BR.md
            docs/**/*.md
          fail: true
