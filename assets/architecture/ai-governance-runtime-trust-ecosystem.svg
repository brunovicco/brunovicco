<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI Platform Architecture</title>
  <desc id="desc">
    Architecture diagram showing AI products, agents, and developer workflows on top; a central AI Platform
    with control plane, model access, identity and tool access, agent runtime, observability, evaluation and quality,
    and AI developer platform; supported by a cloud and platform foundation. Security, governance, and evidence
    and auditability are shown as cross-cutting capabilities.
  </desc>

  <defs>
    <linearGradient id="platformGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>

    <style>
      :root {
        color-scheme: light dark;
      }

      .bg { fill: #ffffff; }
      .surface { fill: #ffffff; stroke: #d0d7de; }
      .surface-soft { fill: #f6f8fa; stroke: #d0d7de; }
      .platform-shell { fill: url(#platformGrad); stroke: #8b5cf6; }
      .text { fill: #24292f; }
      .muted { fill: #57606a; }
      .transversal { fill: #f6f8fa; stroke: #afb8c1; }
      .chip-text { fill: #24292f; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .surface { fill: #161b22; stroke: #30363d; }
        .surface-soft { fill: #0d1117; stroke: #30363d; }
        .platform-shell { fill: #111827; stroke: #8b5cf6; }
        .text { fill: #f0f6fc; }
        .muted { fill: #8b949e; }
        .transversal { fill: #161b22; stroke: #484f58; }
        .chip-text { fill: #f0f6fc; }
      }

      text {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .title {
        font-size: 28px;
        font-weight: 700;
      }

      .layer-title {
        font-size: 24px;
        font-weight: 700;
      }

      .card-title {
        font-size: 20px;
        font-weight: 700;
      }

      .card-sub {
        font-size: 16px;
        font-weight: 500;
      }

      .small {
        font-size: 15px;
        font-weight: 600;
      }

      .label {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .08em;
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1120" rx="28"/>

  <g filter="url(#shadow)">
    <rect class="surface" x="290" y="70" width="1120" height="120" rx="24" stroke-width="2"/>
    <rect x="290" y="70" width="10" height="120" rx="5" fill="url(#topGrad)"/>
  </g>

  <g transform="translate(345,106)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#2563eb" opacity="0.12"/>
    <rect x="13" y="13" width="11" height="11" rx="3" fill="#2563eb"/>
    <rect x="28" y="13" width="11" height="11" rx="3" fill="#7c3aed"/>
    <rect x="13" y="28" width="11" height="11" rx="3" fill="#7c3aed"/>
    <rect x="28" y="28" width="11" height="11" rx="3" fill="#2563eb"/>

    <text class="text title" x="76" y="22">AI Products · Agents · Developer Workflows</text>
    <text class="muted card-sub" x="76" y="49">User-facing experiences and engineering workflows built on shared platform capabilities</text>
  </g>

  <line x1="850" y1="190" x2="850" y2="242" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect class="platform-shell" x="145" y="250" width="1410" height="620" rx="30" stroke-width="2.5"/>
  </g>

  <g transform="translate(195,286)">
    <circle cx="15" cy="15" r="15" fill="#7c3aed" opacity="0.18"/>
    <path d="M8 15h14M15 8v14" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
    <text class="text layer-title" x="44" y="23">AI Platform</text>
    <text class="muted card-sub" x="44" y="48">Shared control, runtime, observability, quality, and developer enablement capabilities</text>
  </g>

  <g>
    <rect class="surface" x="200" y="365" width="400" height="170" rx="22" stroke-width="1.6"/>
    <circle cx="240" cy="405" r="20" fill="#7c3aed" opacity="0.12"/>
    <path d="M232 405h16M240 397v16" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <text class="text card-title" x="275" y="407">Control Plane</text>
    <text class="muted card-sub" x="240" y="452">
      <tspan x="240" dy="0">Policy · Approval</tspan>
      <tspan x="240" dy="26">Evidence</tspan>
    </text>
  </g>

  <g>
    <rect class="surface" x="650" y="365" width="400" height="170" rx="22" stroke-width="1.6"/>
    <circle cx="690" cy="405" r="20" fill="#2563eb" opacity="0.12"/>
    <path d="M681 411l9-12 9 12M681 399h18" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="text card-title" x="725" y="407">Model Access</text>
    <text class="muted card-sub" x="690" y="452">
      <tspan x="690" dy="0">Routing · Cost</tspan>
      <tspan x="690" dy="26">Risk · Availability</tspan>
    </text>
  </g>

  <g>
    <rect class="surface" x="1100" y="365" width="400" height="170" rx="22" stroke-width="1.6"/>
    <circle cx="1140" cy="405" r="20" fill="#0891b2" opacity="0.12"/>
    <path d="M1133 405a7 7 0 1 0 14 0a7 7 0 1 0-14 0M1140 412v8M1135 420h10" stroke="#0891b2" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <text class="text card-title" x="1175" y="407">Identity &amp; Tool Access</text>
    <text class="muted card-sub" x="1140" y="452">
      <tspan x="1140" dy="0">OAuth/OIDC · MCP</tspan>
      <tspan x="1140" dy="26">Least Privilege</tspan>
    </text>
  </g>

  <g>
    <rect class="surface" x="200" y="570" width="400" height="170" rx="22" stroke-width="1.6"/>
    <circle cx="240" cy="610" r="20" fill="#0ea5e9" opacity="0.12"/>
    <path d="M230 612c5-12 15-12 20 0M230 618c5-7 15-7 20 0M240 623h0" stroke="#0ea5e9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text class="text card-title" x="275" y="612">Agent Runtime</text>
    <text class="muted card-sub" x="240" y="657">
      <tspan x="240" dy="0">A2A · MCP</tspan>
      <tspan x="240" dy="26">Structured Contracts</tspan>
    </text>
  </g>

  <g>
    <rect class="surface" x="650" y="570" width="400" height="170" rx="22" stroke-width="1.6"/>
    <circle cx="690" cy="610" r="20" fill="#0f766e" opacity="0.12"/>
    <path d="M680 611c5-12 15-12 20 0M680 617c5-7 15-7 20 0M690 622h0" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text class="text card-title" x="725" y="612">Observability</text>
    <text class="muted card-sub" x="690" y="657">
      <tspan x="690" dy="0">OpenTelemetry · Traces</tspan>
      <tspan x="690" dy="26">Runtime Evidence</tspan>
    </text>
  </g>

  <g>
    <rect class="surface" x="1100" y="570" width="400" height="170" rx="22" stroke-width="1.6"/>
    <circle cx="1140" cy="610" r="20" fill="#16a34a" opacity="0.12"/>
    <path d="M1130 611l7 7 14-16" stroke="#16a34a" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="text card-title" x="1175" y="612">Evaluation &amp; Quality</text>
    <text class="muted card-sub" x="1140" y="657">
      <tspan x="1140" dy="0">RAG Metrics · Evals</tspan>
      <tspan x="1140" dy="26">Regression</tspan>
    </text>
  </g>

  <g>
    <rect class="surface" x="650" y="755" width="400" height="90" rx="22" stroke-width="1.6"/>
    <circle cx="690" cy="800" r="20" fill="#f59e0b" opacity="0.14"/>
    <path d="M681 807h18M684 801h12M687 795h6" stroke="#f59e0b" stroke-width="2.7" fill="none" stroke-linecap="round"/>
    <text class="text card-title" x="725" y="792">AI Developer Platform</text>
    <text class="muted card-sub" x="725" y="819">Harnesses · Gates · Deterministic Execution</text>
  </g>

  <g>
    <text class="muted label" x="195" y="900">CROSS-CUTTING CAPABILITIES</text>

    <rect class="transversal" x="470" y="875" width="170" height="48" rx="24" stroke-width="1.4"/>
    <circle cx="500" cy="899" r="9" fill="#dc2626" opacity="0.18"/>
    <path d="M496 899l3 3 6-7" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="chip-text small" x="520" y="905">Security</text>

    <rect class="transversal" x="670" y="875" width="185" height="48" rx="24" stroke-width="1.4"/>
    <circle cx="700" cy="899" r="9" fill="#7c3aed" opacity="0.18"/>
    <path d="M695 899h10M700 894v10" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <text class="chip-text small" x="720" y="905">Governance</text>

    <rect class="transversal" x="885" y="875" width="275" height="48" rx="24" stroke-width="1.4"/>
    <circle cx="915" cy="899" r="9" fill="#0ea5e9" opacity="0.18"/>
    <path d="M908 900c4-7 10-7 14 0M910 904c3-4 7-4 10 0" stroke="#0ea5e9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text class="chip-text small" x="935" y="905">Evidence &amp; Auditability</text>

    <line x1="470" y1="865" x2="1160" y2="865" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 8" opacity="0.55"/>
  </g>

  <line x1="850" y1="870" x2="850" y2="918" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect class="surface-soft" x="280" y="940" width="1140" height="125" rx="24" stroke-width="2"/>
  </g>

  <g transform="translate(340,973)">
    <circle cx="26" cy="26" r="26" fill="#2563eb" opacity="0.10"/>
    <path d="M14 30h24c5 0 8-3 8-7s-3-7-8-7c-2-7-8-11-15-8c-4 2-6 5-6 9c-5 0-9 3-9 7s3 6 6 6z"
          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
    <text class="text card-title" x="72" y="20">Cloud &amp; Platform Foundation</text>
    <text class="muted card-sub" x="72" y="48">AWS · IaC · CI/CD Identity · Observability · Cost Controls</text>
  </g>
</svg>
